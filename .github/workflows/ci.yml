name: CI

on:
  push:
    branches: [main, 'feature/**', 'bugfix/**', 'refactor/**', 'hotfix/**']
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      # "Wired or it doesn't count": el 04-08 se encontraron tres módulos
      # completos y testeados sin un solo caller (demografía, veredicto de
      # cabida, motor de cabida). Bloqueante a propósito, con trinquete: los 39
      # huérfanos preexistentes viven en el baseline y no fallan; solo falla si
      # aparece uno nuevo.
      - name: Funciones huérfanas (wired or it doesn't count)
        run: npm run check:orphans
      # Bloqueante desde el 05-08. Venía con continue-on-error "mientras el
      # registro madura", y el costo de esa tolerancia se cobró: acumuló 15
      # fallos duros (12 de ellos falsos positivos del chequeo 3, que quedó
      # obsoleto al consolidar los crons en /api/cron/dispatch) y con ese
      # ruido de fondo nadie vio los 3 reales — entre ellos una fuente
      # (mercado-locales-doomos) escribiendo salud contra un id inexistente
      # durante 4 días. Un guard que grita siempre no dice nada.
      - name: Registro de fuentes de datos (Torre de Control)
        run: npm run check:data-sources
      # El smoke E2E (npm run test:e2e) necesita Supabase + OPENAI_API_KEY
      # reales; se corre localmente, no en CI.
