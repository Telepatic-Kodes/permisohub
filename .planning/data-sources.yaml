# Registro de fuentes de datos externas de PermisoHub — Torre de Control.
#
# Fuente única de verdad de qué alimenta la app desde afuera: scrapers, APIs,
# bases de conocimiento curadas a mano. Poblado desde una auditoría completa
# del repo (1 ago 2026) — no es un scaffold vacío, ya trae los hallazgos.
#
# Validar con: node scripts/check-data-sources.mjs
#
# Campos:
#   id               identificador único, kebab-case
#   name             nombre humano
#   type             scraper | cron | api-endpoint | static-kb | db-table
#   owner_files      archivos que implementan la fuente (deben existir)
#   trigger          "cron:<path en vercel.json>" | "manual" | "none"
#   called_from      archivos/rutas que invocan la fuente (para detectar huérfanos reales)
#   freshness_sla_days  null = sin SLA definido aún (no adivinar)
#   last_verified    última vez que alguien confirmó que el dato/código es correcto
#   monitoring       sentry | console-only | none
#   duplicate_of     id de otra entrada si esto es una reimplementación del mismo dato
#   status           active | orphaned | duplicate | stale-kb | needs-decision
#   notes            contexto libre

